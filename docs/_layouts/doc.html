---
layout: default
---
<style>
.doc{max-width:52em}
.doc h1{font-size:40px;color:var(--navy);margin:0 0 16px;font-weight:800}
.doc h2{font-size:26px;color:var(--navy);margin:40px 0 10px}
.doc h3{font-size:19px;color:var(--navy);margin:28px 0 8px}
.doc table{border-collapse:collapse;margin:12px 0 20px;width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--bg-soft)}
.doc code{background:var(--bg-soft);border-radius:4px;padding:1px 5px;font-size:.92em}
.doc pre{background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto}
.doc pre code{background:none;padding:0}
</style>
<section class="pad"><div class="wrap doc">
{{ content }}
</div></section>
