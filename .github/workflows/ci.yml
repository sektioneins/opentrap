# Compile and run the test suite on every push and pull request.
#
# The suite is plain javac plus a hand-rolled harness (no Maven or Gradle), so
# the job runs exactly the two justfile recipes every contributor runs
# locally. The compiled-in jars under lib/ are vendored in the repository and
# the tests need neither the scan engine nor the browser, so nothing else is
# fetched. The JDK comes from the runner: the portable jdk/ matters for the
# AppImage's glibc compatibility, not for compiling and testing.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The major in JAVA_RELEASE and JDK_VERSION (tools/versions).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"

      # The release pinned in tools/versions, checked against its sha256
      # before it runs.
      - uses: ./.github/actions/install-just

      - name: Build
        run: just build

      # A handful of suites build Swing components, which need a display even
      # headless, so the runner's bundled Xvfb stands one in. Without it those
      # cases throw HeadlessException and the job is red though the code is fine.
      - name: Test
        run: xvfb-run -a just test
